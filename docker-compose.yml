version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: munoz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-munoz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-munoz_password}
      POSTGRES_DB: ${POSTGRES_DB:-munoz_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-munoz}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

